name: benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang zlib1g-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benchmarks/requirements.txt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test Python bindings
        run: PYTHONPATH=build python3 -c "import hft_sdk; hft_sdk.OBIFilterEngine()"

      - name: Run benchmark and reporting pipeline
        run: ./tools/run_pipeline.sh

      - name: Verify install/export and external consumer
        run: ./tools/test_consumer.sh

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          if-no-files-found: error
          path: |
            benchmarks/results/
            benchmarks/plots/
            BENCHMARK_REPORT.md
