name: benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang zlib1g-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benchmarks/requirements.txt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test Python bindings
        run: PYTHONPATH=build python3 -c "import hft_sdk; hft_sdk.OBIFilterEngine()"

      - name: Python live-parser tests
        run: PYTHONPATH=build python3 -m unittest discover -s python/tests -v

      - name: Generate deterministic smoke fixture
        run: python3 tools/generate_synthetic_ticks.py --duration 1 --seed 11 --output data/sample_ticks.csv

      - name: Smoke-test feed runtime
        run: ./build/hft_feed --replay data/sample_ticks.csv --http-port 0 --replay-speed 1000

      - name: Version metadata consistency
        run: python3 -m unittest discover -s tests -p test_metadata.py -v

      - name: Pairs position-rule tests
        run: python3 -m unittest discover -s tests -p 'test_pairs.py' -v

      - name: Run benchmark and reporting pipeline
        run: ./tools/run_pipeline.sh

      - name: Verify install/export and external consumer
        run: ./tools/test_consumer.sh

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          if-no-files-found: error
          path: |
            benchmarks/results/
            benchmarks/plots/
            BENCHMARK_REPORT.md


  wheel:
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install and exercise the wheel outside the source tree
        run: |
          python -m venv /tmp/hft-wheel-test
          wheels=(dist/*.whl)
          /tmp/hft-wheel-test/bin/pip install "${wheels[0]}[live]"
          cd /tmp
          /tmp/hft-wheel-test/bin/python -c "import hft_sdk; from hft_sdk.live import create_feed, LiveConfig; hft_sdk.OBIFilterEngine(); create_feed(LiveConfig())"
          /tmp/hft-wheel-test/bin/hft-sdk --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hft-sdk:ci .
      - run: python3 tests/smoke_container.py hft-sdk:ci

  consumers:
    name: consumer-${{ matrix.os }}-${{ matrix.compiler }}-zlib${{ matrix.disable_zlib }}-shared${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, compiler: g++, disable_zlib: "OFF", shared: "ON"}
          - {os: ubuntu-latest, compiler: clang++, disable_zlib: "ON", shared: "ON"}
          - {os: ubuntu-latest, compiler: g++, disable_zlib: "ON", shared: "OFF"}
          - {os: macos-latest, compiler: clang++, disable_zlib: "OFF", shared: "ON"}
    env:
      CXX: ${{ matrix.compiler }}
      BUILD_DIR: build-consumer
      JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install macOS pkg-config dependencies
        if: runner.os == 'macOS'
        run: |
          brew install zlib pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build and exercise installed consumers
        run: |
          ./tools/test_consumer.sh -DHFT_BUILD_PYTHON=OFF -DHFT_BUILD_BENCHMARKS=OFF \
            -DHFT_BUILD_EVALUATOR=OFF -DHFT_BUILD_REPLAY=OFF -DHFT_ARCH_NATIVE=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=${{ matrix.disable_zlib }} \
            -DHFT_BUILD_SHARED_SDK=${{ matrix.shared }}
          ctest --test-dir "$BUILD_DIR" --output-on-failure
